[workspace]
resolver = "2"
members = [
    "crates/loti-core",
    "crates/loti-cli",
    "crates/loti-tui",
]

[workspace.package]
# Main always carries the NEXT release with a `-dev` pre-release suffix, so
# flake/`--version` builds off main sort before (and are visibly distinct from)
# the final release. A release commit strips the suffix; the release workflow
# refuses to build a tag whose version still carries `-dev`.
version = "0.3.2-dev"
edition = "2021"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
loti-core = { path = "crates/loti-core" }
loti-tui = { path = "crates/loti-tui" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
toml = "0.8"
jiff = { version = "0.1", features = ["serde"] }
regex = "1"
tempfile = "3"
anstream = "0.6"
anstyle = "1"
# The full-screen surface. ratatui-markdown pins ratatui 0.29, which in turn
# fixes the crossterm line; keep all three in step when bumping any of them.
ratatui = "0.29"
ratatui-markdown = "0.3"
crossterm = "0.28"
assert_cmd = "2"

# Single static binary: optimize for size, strip, LTO (SPEC §8 goal).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
