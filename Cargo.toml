[workspace]
resolver = "2"
members = [
    "crates/loti-core",
    "crates/loti-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
loti-core = { path = "crates/loti-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"

# Single static binary: optimize for size, strip, LTO (SPEC §8 goal).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
